<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplication</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f8f9fa;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin: 0;
}
.container {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  width: 300px;
}
input, button {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  font-size: 16px;
  border-radius: 5px;
  border: 1px solid #ccc;
}
button {
  background: #007bff;
  color: white;
  cursor: pointer;
  border: none;
}
button:hover {
  background: #0056b3;
}
</style>
</head>
<body>
<div class="container">
  <h2>Multiply Two Numbers</h2>
  <input type="number" id="num1" placeholder="Enter first number">
  <input type="number" id="num2" placeholder="Enter second number">
  <button onclick="productFun()">Calculate</button>
  <h3 id="result"></h3>
</div>
<script>
function productFun() {
  let num1 = parseFloat(document.getElementById("num1").value);
  let num2 = parseFloat(document.getElementById("num2").value);
  document.getElementById("result").innerHTML = "Product: " + (num1 * num2);
}
</script>
</body>
</html>
