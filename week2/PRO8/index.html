<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Background Color</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f4f4f4;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
p {
  padding: 20px;
  border: 1px solid #ccc;
  border-radius: 5px;
}
</style>
</head>
<body>
<h2>Pick a Color</h2>
<p id="myParagraph">This is a sample paragraph.</p>
<input type="color" id="colorPicker" onchange="changeBackgroundColor()">
<script>
function changeBackgroundColor() {
  document.getElementById("myParagraph").style.backgroundColor = document.getElementById("colorPicker").value;
}
</script>
</body>
</html>
