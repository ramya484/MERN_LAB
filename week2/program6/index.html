<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Welcome Page</title> 
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #ff4757;
        }
        p {
            font-size: 18px;
            margin: 10px 0;
        }
        a {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background: #007bff;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        a:hover {
            background: #0056b3;
        }
    </style>
</head> 
<body> 
    <script> 
        let userName = prompt("Please enter your name"); 
        if (userName) 
            alert(`Welcome to MY PAGE, ${userName}`); 
        else 
            alert("You didn't enter your name"); 
        
        window.onbeforeunload = function(event) { 
            const message = `Goodbye, ${userName}!`; 
            event.returnValue = message; 
            return message; 
        } 
    </script> 
    <h1>Welcome to my page</h1> 
    <p>This is an example page that greets you and says goodbye when you leave.</p> 
    <a href="https://example.com">Go to Example</a> 
</body> 
</html>
